[app]
mode = "dry_run"
log_level = "INFO"
timezone = "Asia/Taipei"

[exchange]
name = "bybit"
account_type = "future"
enable_rate_limit = true
default_leverage = 10

[exchange.bybit]
api_key_env = "BYBIT_API_KEY"
api_secret_env = "BYBIT_API_SECRET"

[telegram]
enabled = false
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id_env = "TELEGRAM_CHAT_ID"

[runtime]
strategy_interval_sec = 60
risk_interval_sec = 1
reconciliation_interval_sec = 30
safe_mode_on_startup_mismatch = true

[database.sqlite]
path = "data/bot.sqlite3"
wal = true

[cache.redis]
enabled = false
url_env = "REDIS_URL"
namespace = "bybit-stream-bot"

[strategy.defaults]
enabled = true
ema_period = 240
value_multiplier = 3
long_amount_usdt = 30
short_amount_usdt = 30

[risk.defaults]
enabled = true
stop_loss_pct = 0.6
low_trail_enable_threshold = 0.3
first_trail_enable_threshold = 0.8
second_trail_enable_threshold = 2.0
low_trail_stop_loss_pct = 0.2
trail_stop_loss_pct = 0.35
higher_trail_stop_loss_pct = 0.2

[risk]
blacklist = [
  "BTC/USDT:USDT",
  "ETH/USDT:USDT",
  "SOL/USDT:USDT",
]

[[symbols]]
symbol = "MOODENG/USDT:USDT"
enabled = true

[[symbols]]
symbol = "1000X/USDT:USDT"
enabled = true
value_multiplier = 3
long_amount_usdt = 30
short_amount_usdt = 30

