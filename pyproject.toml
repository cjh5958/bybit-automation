[project]
name = "bybit-automation"
version = "0.1.0"
description = "A refactored Bybit futures trading automation runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt==4.4.45",
    "pandas==2.2.3",
    "redis>=7.4.0",
    "telebot==0.0.5",
]

[project.scripts]
bybit-automation = "bybit_automation.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bybit_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "fast_setup.py",
    "strategy_bybit.py",
    "trail_bybit.py",
]
