[project]
name = "bybit-stream-bot"
version = "0.1.0"
description = "A refactored Bybit futures trading bot runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt==4.4.45",
    "pandas==2.2.3",
    "telebot==0.0.5",
]

[project.scripts]
bybit-stream-bot = "bybit_stream_bot.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bybit_stream_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "fast_setup.py",
    "strategy_bybit.py",
    "trail_bybit.py",
]
